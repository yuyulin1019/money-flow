<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Money Flow｜輕鬆記帳</title>
  <style>
    :root{--ink:#102a43;--ink-2:#243b53;--muted:#627d98;--line:#d9e2ec;--paper:#f5f8fa;--card:#fff;--accent:#0f9f88;--accent-dark:#087b6a;--accent-soft:#e3f6f1;--danger:#c64949;--warn:#d68a28;--r:18px;--shadow:0 16px 40px rgba(16,42,67,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif} button,input,select,textarea{font:inherit} button{cursor:pointer} button:active{transform:translateY(1px)}
    .app{max-width:1280px;margin:auto;padding:0 24px 48px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:800;letter-spacing:-.7px}.brand b{color:var(--accent)}.nav{display:flex;gap:6px}.nav button{background:transparent;border:0;color:var(--muted);padding:9px 12px;border-radius:9px}.nav button.active,.nav button:hover{color:var(--ink);background:#eaf1f5}.avatar{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.8fr);gap:26px;margin-top:32px}.side{display:grid;align-content:start;gap:18px}.card{background:var(--card);border:1px solid #e8eff4;border-radius:var(--r);box-shadow:var(--shadow)}.section{padding:24px}.eyebrow{font-size:12px;font-weight:800;color:var(--accent-dark);letter-spacing:.04em}.title-row{display:flex;align-items:start;justify-content:space-between;gap:16px}.title-row h1,.title-row h2{margin:3px 0 0;letter-spacing:-.6px}.title-row h1{font-size:26px}.title-row h2{font-size:18px}.sub{color:var(--muted);margin:5px 0 0}.checkin{background:var(--ink);color:#fff;border:0;position:relative;overflow:hidden}.checkin:after{content:"";position:absolute;width:220px;height:220px;right:-80px;top:-115px;border:1px solid rgba(255,255,255,.18);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.05),0 0 0 56px rgba(255,255,255,.035)}.checkin .sub{color:#bed2e1;max-width:440px;position:relative;z-index:1}.checkin .title-row{position:relative;z-index:1}.streak{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);padding:9px 11px;border-radius:10px;font-weight:700;font-size:13px;white-space:nowrap}.streak i{width:9px;height:9px;border-radius:50%;background:#57dfc7;box-shadow:0 0 0 4px rgba(87,223,199,.16)}.check-actions{position:relative;z-index:1;display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:750;white-space:nowrap}.btn.primary{background:var(--accent);color:white}.btn.primary:hover{background:var(--accent-dark)}.btn.secondary{background:#eef5f7;color:var(--ink)}.checkin .btn.secondary{background:#fff;color:var(--ink)}.quick{margin-top:26px}.search{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--ink);outline:none;margin:18px 0 12px}.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,159,136,.12);outline:0}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick-item{background:#f7fafb;border:1px solid #e7eff3;border-radius:12px;min-height:79px;padding:10px;text-align:left;color:var(--ink)}.quick-item:hover{border-color:#89cfc1;background:var(--accent-soft)}.quick-item strong{display:block;font-size:14px}.quick-item span{color:var(--muted);font-size:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.metric{background:#f7fafb;border-radius:12px;padding:13px}.metric span{color:var(--muted);font-size:12px;display:block}.metric strong{font-size:19px;letter-spacing:-.5px}.prepaid-head{display:flex;justify-content:space-between;align-items:center}.text-btn{background:transparent;border:0;color:var(--accent-dark);font-weight:750;padding:4px}.prepaid-list{display:grid;gap:10px;margin-top:15px}.prepaid-item{padding:13px;border:1px solid var(--line);border-radius:12px}.prepaid-item header{display:flex;justify-content:space-between;gap:12px}.prepaid-item small{color:var(--muted)}.bar{height:7px;background:#e8eff3;border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}.budget{margin-top:26px}.budget-row{margin-top:15px}.budget-row header{display:flex;justify-content:space-between;font-size:13px}.budget-row small{color:var(--muted)}.budget-row .bar{margin-top:6px}.tx{margin-top:26px}.tx-list{margin-top:14px}.tx-item{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #edf2f5}.tx-icon{width:35px;height:35px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-dark);font-size:16px}.tx-item strong,.tx-item small{display:block}.tx-item small{font-size:12px;color:var(--muted)}.amount{font-weight:800}.del{display:none;background:transparent;border:0;color:var(--danger);font-size:12px}.tx-item:hover .del{display:block}.chart{margin-top:18px;height:150px;display:flex;align-items:end;gap:11px;border-bottom:1px solid var(--line);padding:0 6px}.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px;height:100%;font-size:11px;color:var(--muted)}.chart-col i{width:100%;max-width:31px;background:#b9dfd7;border-radius:6px 6px 2px 2px;display:block}.chart-col.current i{background:var(--accent)}.donut-row{display:flex;align-items:center;gap:18px;margin-top:22px}.donut{width:122px;height:122px;border-radius:50%;background:conic-gradient(var(--accent) 0 43%,#78c8b8 43% 70%,#d2ebdf 70% 86%,#a9bdca 86% 100%);display:grid;place-items:center;flex:none}.donut:before{content:"";width:78px;height:78px;background:white;border-radius:50%;grid-area:1/1}.donut b{grid-area:1/1;z-index:1;font-size:12px;text-align:center}.legend{display:grid;gap:8px;font-size:13px;flex:1}.legend div{display:flex;justify-content:space-between}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.empty{color:var(--muted);font-size:14px;padding:12px 0}.toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:11px;box-shadow:var(--shadow);transition:.25s}.toast.show{transform:translate(-50%,0)}
    dialog{width:min(540px,calc(100% - 28px));padding:0;border:0;border-radius:18px;box-shadow:0 24px 70px rgba(16,42,67,.28)}dialog::backdrop{background:rgba(16,42,67,.48)}.modal-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:transparent;font-size:24px;color:var(--muted)}.form{padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:750}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink);width:100%}.field textarea{min-height:68px;resize:vertical}.modal-foot{padding:16px 24px 22px;display:flex;justify-content:end;gap:10px}.notice{display:none;grid-column:1/-1;background:#fff6e8;border:1px solid #f5d59e;color:#845400;padding:10px 12px;border-radius:9px;font-size:13px}.notice.show{display:block}.hidden{display:none!important}
    @media(max-width:820px){.app{padding:0 16px 32px;overflow:hidden}.top{height:64px}.nav{display:none}.layout{grid-template-columns:1fr;margin-top:18px;gap:18px}.side{display:contents}.prepaid{order:2}.analysis{order:3}.quick-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.quick-item{min-width:0;overflow:hidden}.summary{grid-template-columns:repeat(3,minmax(0,1fr))}.section{padding:19px}.title-row>div{min-width:0}.title-row h1{font-size:22px}.check-actions{flex-wrap:wrap}.check-actions .btn{flex:1;min-width:0}.side .card{order:initial}.tx{order:4}.form{grid-template-columns:1fr;padding:18px}.field.full{grid-column:auto}.modal-head,.modal-foot{padding-left:18px;padding-right:18px}.avatar{margin-left:auto}}
    @media(max-width:420px){.checkin .title-row{display:block}.checkin .streak{display:inline-flex;margin-top:12px}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.summary{grid-template-columns:1fr 1fr}.summary .metric:last-child{grid-column:1/-1}.streak{font-size:12px}.donut-row{gap:13px}.donut{width:105px;height:105px}.donut:before{width:66px;height:66px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand">money <b>flow</b></div><nav class="nav"><button class="active">總覽</button><button>交易</button><button>分析</button><button>設定</button></nav><button class="avatar" aria-label="個人設定">Y</button></header>
    <div class="layout">
      <section>
        <article class="card section checkin"><div class="title-row"><div><div class="eyebrow">DAILY FLOW</div><h1 id="greeting">今天，讓金流保持清楚。</h1><p class="sub" id="checkMessage">花錢或沒花錢，都可以完成今天的記帳節奏。</p></div><div class="streak"><i></i><span id="streak">0</span> 天連續</div></div><div class="check-actions"><button class="btn primary" id="newTransaction">記下一筆</button><button class="btn secondary" id="noSpend">今天沒有花錢</button></div></article>
        <article class="card section quick"><div class="title-row"><div><div class="eyebrow">QUICK ADD</div><h2>快速記帳</h2><p class="sub">選一個常用項目，確認內容後再儲存。</p></div></div><input class="search" id="quickSearch" type="search" placeholder="搜尋常用項目，例如：咖啡、洗頭" aria-label="搜尋常用項目"><div class="quick-grid" id="quickGrid"></div></article>
        <article class="card section tx"><div class="title-row"><div><div class="eyebrow">ACTIVITY</div><h2>最近交易</h2></div><button class="text-btn" id="resetDemo">重設示範資料</button></div><div class="tx-list" id="txList"></div></article>
      </section>
      <aside class="side">
        <article class="card section"><div class="eyebrow">THIS MONTH</div><h2 style="margin:3px 0 0">十月財務摘要</h2><div class="summary"><div class="metric"><span>實際消費</span><strong id="expenseTotal">$0</strong></div><div class="metric"><span>已付款金額</span><strong id="cashflowTotal">$0</strong></div><div class="metric"><span>剩餘預算</span><strong id="budgetLeft">$0</strong></div></div></article>
        <article class="card section prepaid"><div class="prepaid-head"><div><div class="eyebrow">PREPAID</div><h2 style="margin:3px 0 0;font-size:18px">我的預付款</h2></div><button class="text-btn" id="managePrepaid">管理</button></div><div class="prepaid-list" id="prepaidList"></div></article>
        <article class="card section budget"><div class="title-row"><div><div class="eyebrow">BUDGET</div><h2>預算進度</h2></div><span class="sub" id="budgetOverall"></span></div><div id="budgetList"></div></article>
        <article class="card section analysis"><div class="eyebrow">INSIGHTS</div><h2 style="margin:3px 0 0;font-size:18px">月度分析</h2><div class="chart" id="barChart"></div><div class="donut-row"><div class="donut"><b id="donutCenter">分類<br>比例</b></div><div class="legend" id="legend"></div></div></article>
      </aside>
    </div>
  </main>
  <dialog id="transactionDialog"><div class="modal-head"><div><h2>確認這筆記帳</h2><small style="color:var(--muted)">送出前仍可修改所有資訊。</small></div><button class="close" data-close aria-label="關閉">×</button></div><form class="form" id="transactionForm"><div class="field"><label for="tName">店家／消費項目</label><input id="tName" required></div><div class="field"><label for="tAmount">金額</label><input id="tAmount" type="number" min="0" step="1" required></div><div class="field"><label for="tDate">消費日期</label><input id="tDate" type="date" required></div><div class="field"><label for="tCategory">分類</label><select id="tCategory"></select></div><div class="field"><label for="tPayment">付款方式</label><select id="tPayment"><option>現金</option><option>信用卡</option><option>行動支付</option><option value="prepaid">使用預付款</option></select></div><div class="field hidden" id="prepaidSelectWrap"><label for="tPrepaid">扣除的預付款</label><select id="tPrepaid"></select></div><div class="notice" id="prepaidNotice"></div><div class="field full hidden" id="saveFavoriteWrap"><label style="display:flex;align-items:center;gap:8px;font-weight:650"><input id="saveFavorite" type="checkbox" style="width:auto;accent-color:var(--accent)">儲存為常吃店家，之後可從首頁快速帶入</label></div><div class="field full"><label for="tNote">備註（選填）</label><textarea id="tNote" placeholder="例如：公司附近、與朋友聚餐"></textarea></div></form><div class="modal-foot"><button class="btn secondary" data-close>取消</button><button class="btn primary" id="saveTransaction">確認記帳</button></div></dialog>
  <dialog id="prepaidDialog"><div class="modal-head"><div><h2>新增預付款</h2><small style="color:var(--muted)">儲值當下會記入已付款金額，不會列入實際消費。</small></div><button class="close" data-close aria-label="關閉">×</button></div><form class="form" id="prepaidForm"><div class="field"><label for="pName">方案／店家名稱</label><input id="pName" placeholder="例如：健身房月票" required></div><div class="field"><label for="pType">類型</label><select id="pType"><option value="money">金額儲值</option><option value="sessions">次數療程</option></select></div><div class="field"><label for="pValue">儲值金額／購買金額</label><input id="pValue" type="number" min="0" required></div><div class="field"><label for="pUnits">次數（非療程請填 0）</label><input id="pUnits" type="number" min="0" value="0" required></div></form><div class="modal-foot"><button class="btn secondary" data-close>取消</button><button class="btn primary" id="savePrepaid">新增預付款</button></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const KEY='money-flow-v1', cats=['餐飲','交通','美容保養','日常採買','娛樂','其他'];
    const quicks=[['咖啡',65,'餐飲'],['新增餐飲店家',0,'餐飲'],['洗頭',350,'美容保養'],['捷運',40,'交通'],['超商',95,'日常採買'],['電影',320,'娛樂'],['健身',0,'其他'],['計程車',180,'交通']];
    const icons={餐飲:'◆',交通:'↗',美容保養:'✦',日常採買:'□',娛樂:'○',其他:'+'};
    const money=n=>'$'+Math.round(Number(n)||0).toLocaleString('zh-TW');
    const dateISO=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
    const seed=()=>({budget:18000,budgets:{'餐飲':5000,'交通':2000,'美容保養':3000},streak:4,lastCheck:'',prepaids:[{id:'p1',name:'瑜伽 10 堂課',type:'sessions',value:5000,remainingValue:5000,units:10,remainingUnits:6},{id:'p2',name:'髮廊儲值',type:'money',value:3000,remainingValue:1850,units:0,remainingUnits:0}],transactions:[{id:'a1',name:'洗頭',amount:350,date:dateISO(),category:'美容保養',payment:'prepaid',prepaidId:'p2',note:'髮廊儲值'},{id:'a2',name:'午餐',amount:150,date:dateISO(),category:'餐飲',payment:'信用卡',note:''},{id:'a3',name:'捷運',amount:40,date:dateISO(),category:'交通',payment:'行動支付',note:''},{id:'a4',name:'瑜伽課',amount:500,date:new Date(Date.now()-86400000).toISOString().slice(0,10),category:'娛樂',payment:'prepaid',prepaidId:'p1',note:'第 5 堂'}]});
    let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()} state.foodFavorites ||= []; const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function thisMonth(t){return t.date.slice(0,7)===dateISO().slice(0,7)}
    function actual(){return state.transactions.filter(thisMonth).reduce((a,t)=>a+t.amount,0)}
    function topups(){return state.prepaids.reduce((a,p)=>a+(p.createdThisMonth?p.value:0),0)}
    function render(){
      const total=actual(), cash=state.transactions.filter(t=>thisMonth(t)&&t.payment!=='prepaid').reduce((a,t)=>a+t.amount,0)+topups();
      $('#expenseTotal').textContent=money(total);$('#cashflowTotal').textContent=money(cash);$('#budgetLeft').textContent=money(Math.max(0,state.budget-total));$('#budgetOverall').textContent=money(total)+' / '+money(state.budget);
      $('#streak').textContent=state.streak; $('#checkMessage').textContent=state.lastCheck===dateISO()?'今天已完成記帳。明天再一起保持節奏。':'花錢或沒花錢，都可以完成今天的記帳節奏。'; $('#noSpend').disabled=state.lastCheck===dateISO(); $('#noSpend').textContent=state.lastCheck===dateISO()?'今天已打卡':'今天沒有花錢';
      renderQuick();renderTx();renderPrepaid();renderBudget();renderAnalysis();
    }
    function renderQuick(){const q=$('#quickSearch').value.trim(), favorites=state.foodFavorites.map(x=>[x.name,x.amount,'餐飲',true]), list=[...favorites,...quicks].filter(x=>x[0].includes(q));$('#quickGrid').innerHTML=list.length?list.map((x,i)=>`<button class="quick-item" data-i="${i}"><strong>${esc(x[0])}</strong><span>${x[1]?money(x[1]):'輸入金額'} · ${x[3]?'常吃店家':x[2]}</span></button>`).join(''):'<div class="empty">找不到項目，請用「記下一筆」自訂。</div>';document.querySelectorAll('.quick-item').forEach(b=>b.onclick=()=>openTx(list[b.dataset.i]));}
    function renderTx(){const list=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);$('#txList').innerHTML=list.length?list.map(t=>`<div class="tx-item"><div class="tx-icon">${icons[t.category]||'+'}</div><div><strong>${esc(t.name)}</strong><small>${t.date} · ${t.category}${t.payment==='prepaid'?' · 預付款':''}</small></div><div style="text-align:right"><div class="amount">${money(t.amount)}</div><button class="del" data-id="${t.id}">刪除</button></div></div>`).join(''):'<div class="empty">尚無交易，從快速記帳開始吧。</div>';document.querySelectorAll('.del').forEach(b=>b.onclick=()=>removeTx(b.dataset.id));}
    function renderPrepaid(){const ps=state.prepaids;$('#prepaidList').innerHTML=ps.length?ps.map(p=>{const rem=p.type==='money'?p.remainingValue:p.remainingUnits, all=p.type==='money'?p.value:p.units, label=p.type==='money'?money(rem)+' 剩餘':rem+' 次剩餘';return `<div class="prepaid-item"><header><div><strong>${esc(p.name)}</strong><small>${p.type==='money'?'金額儲值':'次數療程'}</small></div><strong>${label}</strong></header><div class="bar"><i style="width:${all?Math.max(0,rem/all*100):0}%"></i></div></div>`}).join(''):'<div class="empty">尚未建立預付款。</div>'}
    function renderBudget(){const by={};state.transactions.filter(thisMonth).forEach(t=>by[t.category]=(by[t.category]||0)+t.amount);$('#budgetList').innerHTML=Object.entries(state.budgets).map(([c,b])=>{const used=by[c]||0,p=Math.min(100,used/b*100);return `<div class="budget-row"><header><span>${c}</span><small>${money(used)} / ${money(b)}</small></header><div class="bar"><i style="width:${p}%;background:${p>90?'var(--warn)':'var(--accent)'}"></i></div></div>`}).join('')}
    function renderAnalysis(){const by={};state.transactions.filter(thisMonth).forEach(t=>by[t.category]=(by[t.category]||0)+t.amount);const groups=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,4);const colors=['#0f9f88','#78c8b8','#d2ebdf','#a9bdca'];$('#legend').innerHTML=groups.length?groups.map(([c,v],i)=>`<div><span><i style="background:${colors[i]}"></i>${c}</span><b>${money(v)}</b></div>`).join(''):'<span class="empty">新增交易後顯示分類。</span>';const vals=[2100,1800,3250,2600,2900,actual()||600], labels=['5月','6月','7月','8月','9月','10月'], max=Math.max(...vals);$('#barChart').innerHTML=vals.map((v,i)=>`<div class="chart-col ${i===5?'current':''}"><i style="height:${Math.max(12,v/max*100)}%"></i><span>${labels[i]}</span></div>`).join('')}
    function openTx(q){const diningStarter=q&&q[0]==='新增餐飲店家';$('#tName').value=diningStarter?'':q?q[0]:'';$('#tName').placeholder=diningStarter?'例如：巷口麵店':'';$('#tAmount').value=q?q[1]:'';$('#tDate').value=dateISO();$('#tCategory').innerHTML=cats.map(c=>`<option ${q&&c===q[2]?'selected':''}>${c}</option>`).join('');$('#saveFavorite').checked=Boolean(diningStarter);$('#saveFavoriteWrap').classList.toggle('hidden',!(q&&q[2]==='餐飲'));$('#tPayment').value='信用卡';$('#tNote').value='';fillPrepaids();paymentChange();$('#transactionDialog').showModal()}
    function fillPrepaids(){const usable=state.prepaids.filter(p=>p.type==='money'?p.remainingValue>0:p.remainingUnits>0);$('#tPrepaid').innerHTML=usable.map(p=>`<option value="${p.id}">${esc(p.name)}（${p.type==='money'?money(p.remainingValue):p.remainingUnits+' 次'}）</option>`).join('')||'<option value="">沒有可用預付款</option>'}
    function paymentChange(){const is=$('#tPayment').value==='prepaid', p=state.prepaids.find(x=>x.id===$('#tPrepaid').value);$('#prepaidSelectWrap').classList.toggle('hidden',!is);$('#prepaidNotice').classList.toggle('show',is);if(is)$('#prepaidNotice').textContent=p?(p.type==='money'?'此筆金額會從餘額扣除；不會重複計入已付款金額。':'此筆會扣除 1 次，並認列輸入的消費金額。'):'目前沒有可使用的預付款。'}
    function saveTx(){const payment=$('#tPayment').value, amount=Number($('#tAmount').value), prepaidId=$('#tPrepaid').value,name=$('#tName').value.trim(),category=$('#tCategory').value;if(!$('#transactionForm').reportValidity())return;if(payment==='prepaid'){const p=state.prepaids.find(x=>x.id===prepaidId);if(!p)return toast('請先建立可使用的預付款');if(p.type==='money'&&amount>p.remainingValue)return toast('此筆金額超過預付款餘額');if(p.type==='sessions'&&p.remainingUnits<1)return toast('療程次數不足');if(p.type==='money')p.remainingValue-=amount;else p.remainingUnits-=1}state.transactions.unshift({id:crypto.randomUUID(),name,amount,date:$('#tDate').value,category,payment,prepaidId:payment==='prepaid'?prepaidId:null,note:$('#tNote').value.trim()});if(category==='餐飲'&&$('#saveFavorite').checked&&!state.foodFavorites.some(x=>x.name===name))state.foodFavorites.unshift({name,amount});state.lastCheck=dateISO();state.streak=Math.max(1,state.streak);save();$('#transactionDialog').close();render();toast(category==='餐飲'&&$('#saveFavorite').checked?'已記帳，也已加入常吃店家。':'已儲存，今天的帳也完成了。')}
    function removeTx(id){const t=state.transactions.find(x=>x.id===id);if(t?.payment==='prepaid'){const p=state.prepaids.find(x=>x.id===t.prepaidId);if(p){if(p.type==='money')p.remainingValue+=t.amount;else p.remainingUnits+=1}}state.transactions=state.transactions.filter(x=>x.id!==id);save();render();toast('已刪除這筆記錄。')}
    function saveP(){if(!$('#prepaidForm').reportValidity())return;const type=$('#pType').value,value=Number($('#pValue').value),units=Number($('#pUnits').value);if(type==='sessions'&&!units)return toast('次數療程請填入購買次數');state.prepaids.unshift({id:crypto.randomUUID(),name:$('#pName').value.trim(),type,value,remainingValue:value,units,remainingUnits:units,createdThisMonth:true});save();$('#prepaidDialog').close();render();toast('預付款已建立，已列入本月付款金額。')}
    let timer;function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2600)}
    $('#newTransaction').onclick=()=>openTx();$('#quickSearch').oninput=renderQuick;$('#noSpend').onclick=()=>{state.lastCheck=dateISO();state.streak+=1;save();render();toast('完成今日打卡，明天見。')};$('#managePrepaid').onclick=()=>$('#prepaidDialog').showModal();$('#tPayment').onchange=paymentChange;$('#tPrepaid').onchange=paymentChange;$('#tCategory').onchange=()=>{const dining=$('#tCategory').value==='餐飲';$('#saveFavoriteWrap').classList.toggle('hidden',!dining);if(!dining)$('#saveFavorite').checked=false};$('#saveTransaction').onclick=saveTx;$('#savePrepaid').onclick=saveP;$('#resetDemo').onclick=()=>{if(confirm('要將所有本機資料重設為示範資料嗎？')){state=seed();save();render();toast('已重設示範資料。')}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());render();
  </script>
</body>
</html>
